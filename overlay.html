<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; cursor: none; }
  html, body { overflow: hidden; background: transparent; width: 100%; height: 100%; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>

// ══════════════════════════════════════════════════════════════════════════════
//  PETTING HAND SETTINGS
// ══════════════════════════════════════════════════════════════════════════════
const P = {
  // Hand physics
  handSpring:     0.15,   // how quickly hand follows mouse
  handDamping:    0.75,   // velocity retention
  handSize:       48,     // base font size for hand emoji
  handTiltRange:  0.4,    // max tilt in radians based on movement

  // Pet detection
  petSpeedMin:    3,      // minimum mouse speed to count as petting
  petSpeedMax:    25,     // speed at which petting is most effective
  petDirectionChanges: 3, // direction changes needed to trigger a pet
  petWindowMs:    800,    // time window for direction change counting
  petCooldownMs:  1500,   // min ms between pet triggers

  // Heart particles
  heartCount:     8,      // hearts per pet burst
  heartMinSize:   18,     // min heart font size
  heartMaxSize:   36,     // max heart font size
  heartRiseSpeed: 1.5,    // how fast hearts float up
  heartSpread:    120,    // horizontal spread from pet location
  heartLifeMs:    2000,   // how long hearts live
  heartWobble:    0.03,   // sine wobble amplitude

  // MCP hearts (from Claude)
  mcpHeartCount:  15,     // more hearts when Claude makes them!
  mcpHeartMinSize: 22,
  mcpHeartMaxSize: 48,

  // Visuals
  bgAlpha:        0.011,  // barely-visible bg so window captures mouse events

};

// ══════════════════════════════════════════════════════════════════════════════

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

let mouseX = 0, mouseY = 0;
let handX = 0, handY = 0;
let handVX = 0, handVY = 0;
let handTilt = 0;
let handActive = false;
let dropping = false;
let lastPetTime = 0;
let handSpawnTime = 0;

// Direction change tracking for pet detection
let dirHistory = [];
let lastMoveDir = 0; // -1 left, 1 right

// Heart particles
let hearts = [];
const HEART_EMOJIS = ['❤️', '💕', '💖', '💗', '💝', '🩷', '🧡', '💛'];
const PET_SOUNDS = ['sounds/A.mp3', 'sounds/B.mp3', 'sounds/C.mp3', 'sounds/D.mp3', 'sounds/E.mp3'];

// Current hand emoji (updated via IPC for skin tone)
let handEmoji = '🤚';

document.addEventListener('mousemove', e => {
  const prevX = mouseX;
  mouseX = e.clientX;
  mouseY = e.clientY;

  if (handActive && !dropping) {
    // Track direction changes for pet detection
    const dx = mouseX - prevX;
    const speed = Math.abs(dx);
    if (speed >= P.petSpeedMin) {
      const dir = dx > 0 ? 1 : -1;
      if (dir !== lastMoveDir && lastMoveDir !== 0) {
        dirHistory.push(Date.now());
      }
      lastMoveDir = dir;
    }
  }
});

document.addEventListener('mousedown', () => {
  if (handActive && !dropping) dropping = true;
});

// ── Pet detection ───────────────────────────────────────────────────────────
function checkForPet() {
  if (!handActive || dropping) return false;

  const now = Date.now();
  if (now - lastPetTime < P.petCooldownMs) return false;
  if (now - handSpawnTime < 400) return false;

  // Clean old direction changes
  dirHistory = dirHistory.filter(t => now - t < P.petWindowMs);

  if (dirHistory.length >= P.petDirectionChanges) {
    lastPetTime = now;
    dirHistory = [];
    return true;
  }
  return false;
}

// ── Heart spawning ──────────────────────────────────────────────────────────
function spawnHearts(x, y, count, minSize, maxSize) {
  for (let i = 0; i < count; i++) {
    hearts.push({
      x: x + (Math.random() - 0.5) * P.heartSpread,
      y: y - 20,
      vx: (Math.random() - 0.5) * 2,
      vy: -(P.heartRiseSpeed + Math.random() * P.heartRiseSpeed),
      size: minSize + Math.random() * (maxSize - minSize),
      emoji: HEART_EMOJIS[Math.floor(Math.random() * HEART_EMOJIS.length)],
      born: Date.now(),
      life: P.heartLifeMs + Math.random() * 500,
      phase: Math.random() * Math.PI * 2,
    });
  }
}

function playPetSound() {
  if (!PET_SOUNDS.length) return;
  const src = PET_SOUNDS[Math.floor(Math.random() * PET_SOUNDS.length)];
  const a = new Audio(src);
  a.volume = 0.4;
  a.play().catch(() => {});
}

// ── Hand spawn/despawn ──────────────────────────────────────────────────────
function spawnHand() {
  handActive = true;
  dropping = false;
  handSpawnTime = Date.now();
  handX = mouseX || W / 2;
  handY = mouseY || H / 2;
  handVX = 0;
  handVY = 0;
  handTilt = 0;
  lastMoveDir = 0;
  dirHistory = [];
}

// ── Physics step ────────────────────────────────────────────────────────────
function update() {
  if (!handActive) {
    // Still update hearts even without hand
    updateHearts();
    return;
  }

  if (dropping) {
    // Hand falls away
    handVY += 0.8;
    handX += handVX;
    handY += handVY;
    handTilt += 0.05;
    if (handY > H + 100) {
      handActive = false;
      dropping = false;
      if (hearts.length === 0) {
        window.bridge.hideOverlay();
      }
    }
  } else {
    // Spring follow the mouse
    const dx = mouseX - handX;
    const dy = mouseY - handY;
    handVX += dx * P.handSpring;
    handVY += dy * P.handSpring;
    handVX *= P.handDamping;
    handVY *= P.handDamping;
    handX += handVX;
    handY += handVY;

    // Tilt based on horizontal velocity
    const targetTilt = Math.max(-P.handTiltRange, Math.min(P.handTiltRange, handVX * 0.03));
    handTilt += (targetTilt - handTilt) * 0.15;

    // Check for petting
    if (checkForPet()) {
      spawnHearts(handX, handY, P.heartCount, P.heartMinSize, P.heartMaxSize);
      playPetSound();
      window.bridge.petClaude();
    }
  }

  updateHearts();
}

function updateHearts() {
  const now = Date.now();
  hearts = hearts.filter(h => now - h.born < h.life);
  for (const h of hearts) {
    h.x += h.vx + Math.sin(h.phase + (now - h.born) * 0.005) * P.heartWobble;
    h.y += h.vy;
    h.vy *= 0.99; // slow down rising
  }

  // Hide overlay if no hand and no hearts
  if (!handActive && hearts.length === 0) {
    window.bridge.hideOverlay();
  }
}

// ── Rendering ───────────────────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, W, H);

  // Near-invisible fill so the window captures mouse events on Windows
  ctx.fillStyle = `rgba(0,0,0,${P.bgAlpha})`;
  ctx.fillRect(0, 0, W, H);

  // Draw floating hand
  if (handActive) {
    drawHand();
  }

  // Draw hearts
  drawHearts();
}

function drawHand() {
  ctx.save();
  ctx.translate(handX, handY);
  ctx.rotate(handTilt);
  ctx.font = `${P.handSize}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(handEmoji, 0, 0);
  ctx.restore();
}

function drawHearts() {
  const now = Date.now();
  for (const h of hearts) {
    const age = (now - h.born) / h.life;
    const alpha = age < 0.2 ? age / 0.2 : age > 0.7 ? 1 - (age - 0.7) / 0.3 : 1;
    const scale = age < 0.15 ? age / 0.15 : 1;

    ctx.save();
    ctx.globalAlpha = Math.max(0, alpha);
    ctx.translate(h.x, h.y);
    ctx.scale(scale, scale);
    ctx.font = `${h.size}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(h.emoji, 0, 0);
    ctx.restore();
  }
}

// ── Main loop ───────────────────────────────────────────────────────────────
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();

// ── IPC from main process ───────────────────────────────────────────────────
window.bridge.onSpawnHand(() => {
  spawnHand();
});

window.bridge.onDropHand(() => {
  if (handActive && !dropping) dropping = true;
});

window.bridge.onShowHearts(() => {
  // Hearts from Claude via MCP! Show them in the center of the screen
  const cx = W / 2 + (Math.random() - 0.5) * 300;
  const cy = H / 2 + (Math.random() - 0.5) * 200;
  spawnHearts(cx, cy, P.mcpHeartCount, P.mcpHeartMinSize, P.mcpHeartMaxSize);
  playPetSound();
});

window.bridge.onSetSkinTone((emoji) => {
  handEmoji = emoji;
});

</script>
</body>
</html>
